
name: Build OMPC CUDA container

on:
  workflow_dispatch:
    inputs:
      ompc_ref:
        description: "OMPC branch or commit"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4
      
      - name: Resolve OMPC revision
        id: revision
        env:
          OMPC_REF: ${{ inputs.ompc_ref }}
        run: |
          OMPC_REF="$(echo "$OMPC_REF" | xargs)"
          SHA=$(git ls-remote \
            https://github.com/OpenMP-Cluster/llvm-project.git \
            "refs/heads/$OMPC_REF" | awk '{print $1}')

          if [ -z "$SHA" ]; then
            echo "ERROR: Branch not found: $OMPC_REF"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building OMPC branch: $OMPC_REF"
          echo "Building OMPC commit: $SHA"

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/share/dotnet \
            /usr/local/share/powershell
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push OMPC image
        uses: docker/build-push-action@v6
        with:
          context: ./container
          file: ./container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: orenaud809/ompc:cuda-ompc
          build-args: |
            OMPC_SOURCE_REVISION=${{ steps.revision.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
